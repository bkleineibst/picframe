apply plugin: 'com.android.application'

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(':owncloud-library')
    implementation 'com.android.support:appcompat-v7:28.0.0'
    //implementation 'ch.acra:acra:4.6.2'
    implementation 'com.android.support:support-v4:28.0.0'
}

android {
    namespace 'picframe.at.picframe'
    compileSdk 35

    useLibrary 'org.apache.http.legacy'

    defaultConfig {
        applicationId "picframe.at.picframe"
        minSdk 21
        targetSdk 35
        // Publishing passes a higher one, because devices only take an update with
        // a higher versionCode. See build-release.sh.
        versionCode project.hasProperty('appVersionCode') ? project.appVersionCode.toInteger() : 13
        versionName "1.6.4"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packaging {
        resources {
            excludes += ['META-INF/LICENSE.txt']
        }
    }
}
