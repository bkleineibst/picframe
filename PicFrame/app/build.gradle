apply plugin: 'com.android.application'

dependencies {
    compile fileTree(include: ['*.jar'], dir: 'libs')
    compile project(':owncloud-library')
    compile 'com.android.support:appcompat-v7:21.0.0'
    //compile 'ch.acra:acra:4.6.2'
    compile 'com.android.support:support-v4:23.0.1'
}

android {
    compileSdkVersion 34
    buildToolsVersion "30.0.3"
    
    useLibrary 'org.apache.http.legacy'

    defaultConfig {
        applicationId "picframe.at.picframe"
        minSdkVersion 21
        targetSdkVersion 34
        // Publishing passes a higher one, because devices only take an update with
        // a higher versionCode. See build-release.sh.
        versionCode project.hasProperty('appVersionCode') ? project.appVersionCode.toInteger() : 13
        versionName "1.6.4"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}


android {
    packagingOptions {
        exclude 'META-INF/LICENSE.txt'
    }
}