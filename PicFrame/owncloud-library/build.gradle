apply plugin: 'com.android.library'

repositories {
    mavenCentral()
}

dependencies {
    // api, not implementation: public classes here (e.g. OwnCloudClient) extend these
    // jackrabbit-webdav brings jcl-over-slf4j, which provides the same classes as
    // commons-logging; the old build shipped only jcl-over-slf4j.
    api('commons-httpclient:commons-httpclient:3.1') {
        exclude group: 'commons-logging', module: 'commons-logging'
    }
    api 'org.apache.jackrabbit:jackrabbit-webdav:2.7.2'
    api 'org.slf4j:slf4j-api:1.7.5'
}

android {
    namespace 'com.owncloud.android.lib'
    compileSdk 35

    defaultConfig {
        minSdk 21
    }
    
    useLibrary 'org.apache.http.legacy'

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            resources.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }

        // Move the tests to tests/java, tests/res, etc...
        androidTest.setRoot('tests')

        // Move the build types to build-types/<type>
        // For instance, build-types/debug/java, build-types/debug/AndroidManifest.xml, ...
        // This moves them out of them default location under src/<type>/... which would
        // conflict with src/ being used by the main source set.
        // Adding new build types or product flavors should be accompanied
        // by a similar customization.
        debug.setRoot('build-types/debug')
        release.setRoot('build-types/release')
    }

    lint {
        abortOnError false
    }
}
